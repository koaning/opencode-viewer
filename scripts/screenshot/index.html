<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; }
      body[data-mode="light"] { background: #fcfcfb; }
      /* Desktop sets these per theme; the dashboard's CSS only carries light fallbacks for most of them. */
      body[data-mode="dark"] {
        background: #1a1a19;
        --v2-text-text-base: #ededec;
        --v2-text-text-muted: #a3a29c;
        --v2-text-text-faint: #75746f;
        --v2-border-border-muted: rgba(255, 255, 255, 0.09);
        --v2-background-bg-layer-01: rgba(255, 255, 255, 0.035);
        --v2-background-bg-layer-02: rgba(255, 255, 255, 0.07);
      }
      #app { width: 560px; }
      /* The panel scrolls inside Desktop's side region; here the page is as tall as the dashboard. */
      #app .ocv-root { height: auto; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
